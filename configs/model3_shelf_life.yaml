# Model 3 shelf-life lookup (APPROVED 2026-10-09). NOT a regression target.
# Remaining-shelf-life RANGE implied by the stage predicted by the stage head,
# derived from AgriFreshNET's own per-folder storage-day annotations:
#   remaining = [rotten_start - stage_end, rotten_start - stage_start]
# These ranges describe the SOURCE DATASET'S storage conditions (ambient storage,
# Bangladesh, Nov 2025 - Jan 2026). They are NOT universal shelf-life guarantees,
# are NOT temperature-adjusted, and add no information beyond the predicted stage.
source: "AgriFreshNET (Mendeley 10.17632/42m5tb7yv9.1, CC BY 4.0) folder day-range annotations"
unit: days
ranges:
  banana:  {Fresh: [3, 6],   Semi-fresh: [0, 3],  Rotten: [0, 0]}   # bands 1-4 / 4-7 / 7-13
  tomato:  {Fresh: [14, 23], Semi-fresh: [0, 14], Rotten: [0, 0]}   # bands 1-10 / 10-24 / 24-35
  brinjal: {Fresh: [4, 7],   Semi-fresh: [0, 4],  Rotten: [0, 0]}   # bands 1-4 / 4-8 / 8-15
not_available:
  guava: "time-labelled guava data has no end-of-life label"
  apple: "no public storage-time data found"
disclaimer: >-
  Estimated range under the source dataset's storage conditions; not a guarantee.
  Actual shelf life depends on cultivar, harvest maturity, temperature, humidity and handling.
